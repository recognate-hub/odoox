name: Keep Server Alive

on:
  schedule:
    # Runs every 10 minutes (to prevent Render from spinning down after 15 mins)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Health
        run: curl -sSf https://odoox.recognate.in/health || exit 0
