<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ODOOX by RECOGNATE</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        /* === Background Effects === */
        .bg-grid {
            position: absolute;
            inset: 0;
            z-index: -1;
            background-image:
                linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px);
            background-size: 64px 64px;
        }
        .bg-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, var(--brand-primary) 0%, transparent 70%);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 3rem 2.5rem;
            animation: fadeInUp 0.5s var(--ease-out);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .brand-text {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .brand-sub {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .login-desc {
            margin-top: 1rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Messages */
        .alert {
            padding: 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .alert-success {
            background: rgba(34, 197, 94, 0.1);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        /* Step transitions */
        #step-1, #step-2 {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #step-2 {
            display: none;
            opacity: 0;
            transform: translateY(10px);
        }
        
        .code-input-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 1rem;
        }
        .code-input {
            width: 48px;
            height: 56px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            padding: 0;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: color var(--duration-fast);
        }
        .back-link:hover {
            color: var(--text-primary);
        }

        .footer-text {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>

        <div class="glass-card login-card">
            <div class="login-header">
                <div class="brand-text">ODOOX</div>
                <div class="brand-sub">by RECOGNATE</div>
                <p class="login-desc" id="header-text">Sign in to your AI workspace</p>
            </div>

            <div id="error-box" class="alert alert-error"></div>
            <div id="success-box" class="alert alert-success"></div>

            <!-- STEP 1: Request OTP -->
            <div id="step-1">
                <form id="otp-request-form">
                    <div class="form-group">
                        <label class="form-label" for="email">Work Email</label>
                        <input type="email" id="email" name="email" class="form-input" required placeholder="name@company.com">
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block" id="btn-request">
                        Send Magic Code
                    </button>
                </form>
            </div>

            <!-- STEP 2: Verify OTP -->
            <div id="step-2">
                <form id="otp-verify-form">
                    <div class="form-group text-center">
                        <label class="form-label" style="text-transform: none; color: var(--text-secondary);">
                            Enter the 6-digit code sent to your email
                        </label>
                        <div class="code-input-group">
                            <input type="text" maxlength="1" class="form-input code-input" required>
                            <input type="text" maxlength="1" class="form-input code-input" required>
                            <input type="text" maxlength="1" class="form-input code-input" required>
                            <input type="text" maxlength="1" class="form-input code-input" required>
                            <input type="text" maxlength="1" class="form-input code-input" required>
                            <input type="text" maxlength="1" class="form-input code-input" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block mt-3" id="btn-verify">
                        Verify & Login
                    </button>
                    
                    <div class="text-center mt-3">
                        <a href="#" id="btn-back" class="back-link">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                            Back to email
                        </a>
                    </div>
                </form>
            </div>

            <div class="footer-text">
                Secure authentication powered by Supabase
            </div>
        </div>
    </div>

    <script>
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const requestForm = document.getElementById('otp-request-form');
        const verifyForm = document.getElementById('otp-verify-form');
        const errorBox = document.getElementById('error-box');
        const successBox = document.getElementById('success-box');
        const emailInput = document.getElementById('email');
        const btnRequest = document.getElementById('btn-request');
        const btnVerify = document.getElementById('btn-verify');
        const codeInputs = document.querySelectorAll('.code-input');

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
            successBox.style.display = 'none';
        }
        
        function showSuccess(msg) {
            successBox.textContent = msg;
            successBox.style.display = 'block';
            errorBox.style.display = 'none';
        }

        // Auto-advance code inputs
        codeInputs.forEach((input, index) => {
            input.addEventListener('input', function() {
                if (this.value.length === 1) {
                    if (index < codeInputs.length - 1) codeInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value === '') {
                    if (index > 0) codeInputs[index - 1].focus();
                }
            });
        });

        // Step 1: Request OTP
        requestForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnRequest.innerHTML = "Sending...";
            btnRequest.disabled = true;
            errorBox.style.display = 'none';
            
            const formData = new FormData();
            formData.append('email', emailInput.value);

            try {
                const res = await fetch('/login/otp', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    showSuccess("Magic code sent! Please check your inbox.");
                    // Transition to Step 2
                    step1.style.display = 'none';
                    step2.style.display = 'block';
                    setTimeout(() => {
                        step2.style.opacity = '1';
                        step2.style.transform = 'translateY(0)';
                        codeInputs[0].focus();
                    }, 50);
                } else {
                    showError(data.message || "Failed to send OTP");
                }
            } catch (err) {
                showError("Network error occurred.");
            } finally {
                btnRequest.innerHTML = "Send Magic Code";
                btnRequest.disabled = false;
            }
        });

        // Step 2: Verify OTP
        verifyForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnVerify.innerHTML = "Verifying...";
            btnVerify.disabled = true;
            errorBox.style.display = 'none';
            
            let token = "";
            codeInputs.forEach(input => token += input.value);
            
            if (token.length !== 6) {
                showError("Please enter the full 6-digit code.");
                btnVerify.innerHTML = "Verify & Login";
                btnVerify.disabled = false;
                return;
            }

            const formData = new FormData();
            formData.append('email', emailInput.value);
            formData.append('token', token);

            try {
                const res = await fetch('/login/verify', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    const urlParams = new URLSearchParams(window.location.search);
                    const nextUrl = urlParams.get('next');
                    window.location.href = nextUrl ? nextUrl : data.redirect;
                } else {
                    showError(data.message || "Invalid code.");
                }
            } catch (err) {
                showError("Network error occurred.");
            } finally {
                btnVerify.innerHTML = "Verify & Login";
                btnVerify.disabled = false;
            }
        });

        // Back button
        document.getElementById('btn-back').addEventListener('click', (e) => {
            e.preventDefault();
            step2.style.opacity = '0';
            setTimeout(() => {
                step2.style.display = 'none';
                step1.style.display = 'block';
                errorBox.style.display = 'none';
                successBox.style.display = 'none';
            }, 300);
        });
    </script>
</body>
</html>
